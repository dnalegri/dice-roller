<!doctype html>
<meta charset="utf-8">
<title>dice-roller tests</title>
<pre id="out"></pre>
<div id="s1"></div><div id="r1"></div><div id="r2"></div><div id="r3"></div>
<script src="roller.js"></script>
<script src="status.js"></script>
<script>
var fails=0,lines=[];
function ok(cond,name){lines.push((cond?'PASS ':'FAIL ')+name);if(!cond)fails++;}
function done(){document.getElementById('out').textContent=lines.join('\n');document.title=fails?'FAIL '+fails:'PASS '+lines.length;}
var E=VTMCheck._eval,sk={type:'skill',diff:2},D=function(a){return a.map(function(v){return typeof v==='number'?{v:v,h:false}:{v:v[0],h:true};});};

// evalDice: the V5 result rules
ok(E(sk,D([6,7,2])).res==='win'&&E(sk,D([6,7,2])).tier==='barely','2 successes vs diff 2 is a barely win');
ok(E(sk,D([10,10,3])).res==='crit'&&E(sk,D([10,10,3])).tot===4,'pair of 10s is a critical worth 4');
ok(E(sk,D([10,[10],3])).res==='messy','a Hunger 10 in the pair is a messy critical');
ok(E(sk,D([3,[1],2])).res==='bestial','failure with a Hunger 1 is a bestial failure');
ok(E(sk,D([3,4,2])).res==='total','zero successes is a total failure');
ok(E({type:'skill',diff:3},D([6,2,[7]])).res==='fail','2 successes vs diff 3 fails');
ok(E({type:'rouse'},D([5])).res==='fail'&&E({type:'rouse'},D([6])).res==='win','rouse passes on 6+');
ok(E({type:'remorse'},D([2,9])).res==='win','remorse passes on any 6+');

// Masquerade track and city heat (optional fields)
document.body.insertAdjacentHTML('beforeend','<div id="s2"></div><div id="s3"></div>');
VTMStatus({scene:'T',hunger:1,wpMax:5,wpSup:0,wpAgg:0,hpMax:6,hpSup:0,hpAgg:0,humanity:6,stains:0,dice:true,masq:{sup:1,agg:1},heat:2,change:{trait:'masq',note:'x'}},document.getElementById('s2'));
var s2=document.getElementById('s2');
ok(s2.querySelectorAll('#masq .bx').length===5&&s2.querySelectorAll('#masq .bx.agg').length===1&&s2.querySelector('#masq').textContent.indexOf('/')>=0,'masquerade track shows 1 superficial and 1 aggravated');
ok(s2.querySelectorAll('.heat .hp.on').length===2&&s2.querySelector('.hw').textContent==='Suspicious','city heat 2 reads Suspicious');
ok(s2.querySelector('#st-masq').classList.contains('changed'),'masquerade change flashes');
VTMStatus({scene:'T',hunger:1,wpMax:5,wpSup:0,wpAgg:0,hpMax:6,hpSup:0,hpAgg:0,humanity:6,stains:0,dice:true,masq:{sup:0,agg:5}},document.getElementById('s3'));
ok(document.getElementById('s3').querySelector('.mq').textContent==='Burned','full aggravated track reads Burned');
// status strip with no change field, then a roller on the same page (shared ids)
var st={scene:'Test',hunger:2,wpMax:5,wpSup:0,wpAgg:0,hpMax:7,hpSup:0,hpAgg:0,humanity:7,stains:0,dice:true};
try{VTMStatus(st,document.getElementById('s1'));ok(true,'status strip renders without change');}catch(e){ok(false,'status strip renders without change: '+e.message);}
var S={hunger:3,wpMax:5,wpDamage:0,humanity:7,stains:0};
VTMCheck({type:'skill',title:'T',scene:'S',diff:2,a:['Wits',3],s:['Awareness',2],spec:'<i>knives</i>'},S,document.getElementById('r1'));
var r1=document.getElementById('r1');
ok(r1.querySelectorAll('#meter svg').length===5,'roller draws its own Hunger meter');
ok(document.getElementById('s1').querySelectorAll('#meter svg').length===5,'status strip meter untouched');
ok(r1.querySelector('#chips').textContent.indexOf('<i>knives</i>')>=0,'specialty text is escaped');
r1.querySelector('#rollBtn').click();
ok(r1.querySelectorAll('.die.h').length===3,'skill roll uses Hunger dice');

// frenzy: no Hunger dice
VTMCheck({type:'frenzy',title:'F',scene:'S',diff:3},S,document.getElementById('r2'));
var r2=document.getElementById('r2');r2.querySelector('#rollBtn').click();
ok(r2.querySelectorAll('.die').length>0&&r2.querySelectorAll('.die.h').length===0,'frenzy roll has no Hunger dice');

// failed Rouse at Hunger 5 asks for a hunger frenzy test
var rnd=Math.random;Math.random=function(){return 0;};
VTMCheck({type:'rouse',title:'R',scene:'S'},{hunger:5,wpMax:5,wpDamage:0,humanity:7,stains:0},document.getElementById('r3'));
Math.random=rnd;
document.getElementById('r3').querySelector('#rollBtn').click();
setTimeout(function(){var b=document.getElementById('r3').querySelector('#ban');ok(!!b&&b.textContent.indexOf('Hunger frenzy')>=0,'failed Rouse at Hunger 5 shows Hunger frenzy');done();},3000);
</script>

<h3>Music</h3>
<p>The music checks play sound, so they need a click: <button id="musicBtn">Run music test</button></p>
<pre id="music"></pre>
<div id="sc" hidden></div>
<script src="scenes.js"></script>
<script src="ambience.js"></script>
<script>
(function(){
var mfails=0,mlines=[],made=[],RealAudio=window.Audio;
window.Audio=function(){var a=new RealAudio();made.push(a);return a;};
function mok(cond,name){mlines.push((cond?'PASS ':'FAIL ')+name);if(!cond)mfails++;}
function show(){document.getElementById('music').textContent=mlines.join('\n');}
var wait=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
var SCENES=['casino','haven','velvet','desert','sewers','elysium'];

// every scene name gets a music button, and every track file is there
mok(['casino','haven','velvet','lounge','desert','sewers','elysium'].every(function(n){return VTMAmbience.names.indexOf(n)>=0;}),'ambience.js knows every scene name, including the lounge alias');
mok(VTMAmbience.names.every(function(n){VTMScene({title:'t',ambience:n},document.getElementById('sc'));return !!document.querySelector('#sc .am');}),'scenes.js shows a music button for every name ambience.js routes');
mok(VTMAmbience.play('nope')===false,'an unknown name plays nothing');
Promise.all([].concat.apply([],SCENES.map(function(s){return [1,2,3].map(function(i){return fetch('audio/'+s+'-'+i+'.mp3',{method:'HEAD'}).then(function(r){return r.ok;});});})))
 .then(function(r){mok(r.length===18&&r.every(Boolean),'all 18 track files load');show();});

document.getElementById('musicBtn').onclick=async function(){
 mok(VTMAmbience.play('lounge')===true&&VTMAmbience.playing()==='lounge','lounge plays (through haven)');
 await wait(4000);
 var on=made.filter(function(x){return !x.paused;}),a=on[0];
 mok(made.length===2&&on.length===1&&a.currentTime>0.5,'two players are set up and one haven track is playing');
 var row=VTMAmbience.tracks.haven.filter(function(t){return a.src.indexOf(t[0])>=0;})[0];
 mok(!!row&&a.currentTime>=row[1]&&a.currentTime<row[1]+6,'it starts where the music starts ('+(row&&row[0])+' at '+(row&&row[1])+' s)');
 var aSrc=a.src.split('#')[0];a.currentTime=a.duration-5;await wait(6000);
 var b=made.filter(function(x){return x!==a;})[0];
 mok(!b.paused&&/haven-\d\.mp3/.test(b.src)&&b.src.split('#')[0]!==aSrc,'it crossfades to a different track on the other player');
 mok(a.paused&&!a.getAttribute('src'),'the finished track is released');
 mok(made.length===2,'the rotation reuses the same two players (Safari needs this)');
 VTMAmbience.stop();await wait(2500);
 mok(!VTMAmbience.playing()&&made.every(function(x){return x.paused;}),'stop fades out and stops everything');
 VTMScene({title:'t',ambience:'velvet'},document.getElementById('sc'));
 document.querySelector('#sc .am').click();await wait(3000);
 mok(VTMAmbience.playing()==='velvet'&&made.some(function(x){return !x.paused&&/velvet-\d\.mp3/.test(x.src);}),'the scene card music button plays the Velvet Room');
 VTMAmbience.stop();await wait(2000);
 document.title=mfails?'MUSIC FAIL '+mfails:'MUSIC PASS '+mlines.length;show();
};
})();
</script>
